name: Publish

# GitHub'da Release yayınlanınca paket npm'e çıkar. Token yok: npm'deki Trusted Publisher
# ayarı bu dosyanın adına (publish.yml) bağlıdır, adı değişirse orada da değişmeli.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # Trusted Publishing npm 11.5.1+ ister; Node 24 onunla gelir.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Release yanlış etiketten açılırsa package.json'daki sürüm yayınlanmasın.
      - name: Check tag matches version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Etiket $GITHUB_REF_NAME, package.json $version: npm version ile yükseltip o etiketten Release açın."
            exit 1
          fi

      # prepublishOnly yayından önce pnpm check'i çalıştırır.
      - name: Publish
        run: npm publish
